<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saleor Benchmark Store</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; width: 1280px; height: 800px; box-sizing: border-box; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    .search-box { display: flex; gap: 8px; }
    .catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 6px; }
    button { cursor: pointer; padding: 8px 16px; background: #0066cc; color: #fff; border: none; border-radius: 4px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    #cart-badge { background: #e60000; color: #fff; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Saleor Benchmark Store</h1>
    <div class="search-box">
      <input id="search-input" role="textbox" placeholder="Search products..." />
      <button id="search-btn" role="button">Search</button>
    </div>
    <div>Cart Items: <span id="cart-badge">0</span></div>
  </header>
  <main class="catalog">
    <div class="card" id="product-101">
      <h3>Wireless Noise-Cancelling Headphones</h3>
      <p>Premium over-ear headphones with active noise cancellation.</p>
      <button id="add-to-cart-101" role="button" onclick="document.getElementById('cart-badge').innerText = '1'; document.getElementById('cart-status').innerText = 'Item added to cart';">Add to Cart</button>
    </div>
    <div class="card" id="product-102">
      <h3>Ergonomic Mechanical Keyboard</h3>
      <p>Custom mechanical switches with RGB backlighting.</p>
      <button id="add-to-cart-102" role="button" onclick="document.getElementById('cart-badge').innerText = '1';">Add to Cart</button>
    </div>
  </main>
  <div id="cart-status" style="margin-top: 15px; font-weight: bold; color: green;"></div>
</body>
</html>
